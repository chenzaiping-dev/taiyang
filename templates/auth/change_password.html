{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h3 class="mb-2">修改登录密码</h3>
      {% if session.get('must_change_password') %}<div class="alert alert-warning">你正在使用初始密码，请先设置新密码。</div>{% endif %}
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">当前密码</label><input class="form-control" type="password" name="old_password" autocomplete="current-password" required></div>
        <div class="mb-3"><label class="form-label">新密码（至少 8 位）</label><input class="form-control" type="password" name="new_password" minlength="8" autocomplete="new-password" required></div>
        <div class="mb-3"><label class="form-label">确认新密码</label><input class="form-control" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></div>
        <button class="btn btn-primary" type="submit">保存新密码</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
