{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="mb-3">管理员登录</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">用户名</label><input class="form-control" name="username" required></div>
      <div class="mb-3"><label class="form-label">密码</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary">登录</button>
    </form>
    <p class="text-muted mt-3 small">初始开发账号通过 .env 中 BOOTSTRAP_ADMIN_USERNAME / BOOTSTRAP_ADMIN_PASSWORD 配置。上线前应替换为真实账号与权限体系。</p>
  </div>
</div>
{% endblock %}
