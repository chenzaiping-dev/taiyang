{% extends "base.html" %}
{% block title %}员工登录{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-2">员工登录</h3>
        <p class="text-muted small mb-4">登录后根据岗位角色进入对应业务模块</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
          <div class="mb-3"><label class="form-label">员工账号</label><input class="form-control" name="username" autocomplete="username" required autofocus></div>
          <div class="mb-3"><label class="form-label">登录密码</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary w-100" type="submit">员工登录</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="{{ url_for('auth.admin_login') }}">管理员登录</a>
          <span class="text-muted">忘记密码请联系管理员重置</span>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
